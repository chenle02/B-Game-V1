<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>B-Game V1</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><h1>B-Game V1</h1><div class="sub">Tap the target fast</div><div class="stats"><div>Score <b id="score">0</b></div><div>Time <b id="time">30</b></div><div>Best <b id="best">0</b></div></div><div class="box"><button id="easyBtn">Easy</button><button id="normalBtn" class="on">Normal</button><button id="hardBtn">Hard</button><button id="soundBtn">Sound On</button><button id="startBtn" class="green">Start</button></div><div id="arena"><button id="target">TAP</button></div><div class="box"><button id="resetBtn" class="red">Reset Best</button><button id="launcherBtn">B-Launcher</button><button id="musicBtn">B-Music</button><button id="drawBtn">B-Draw</button></div></div><script src="app.js"></script></body></html>
